global:
  scrape_interval: 5s
  evaluation_interval: 5s
  scrape_timeout: 4s

rule_files:
  - "/etc/prometheus/alerts.yml"

scrape_configs:
  - job_name: "prometheus"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "backend"
    metrics_path: "/metrics"
    scrape_interval: 5s
    static_configs:
      - targets: ["backend:8000"]
        labels:
          service: "devforge-backend"
          tier: "control-plane"

  - job_name: "worker"
    metrics_path: "/metrics"
    scrape_interval: 5s
    static_configs:
      - targets: ["worker:8001"]
        labels:
          service: "devforge-worker"
          tier: "orchestration"

  - job_name: "postgres"
    metrics_path: "/metrics"
    scrape_interval: 5s
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels:
          service: "devforge-postgres"
          tier: "datastore"
