apiVersion: devforge/v1
kind: ApplicationManifest
metadata:
  name: "{{APPLICATION_NAME}}"
  version: "{{VERSION}}"
  description: "{{DESCRIPTION}}"
  team: "{{TEAM}}"
spec:
  runtime: "go"
  template: "go-microservice"
  environment: "{{ENVIRONMENT}}"
  port: {{PORT}}
  database:
    type: "{{DATABASE_TYPE}}"
  build:
    docker: true
    dockerfile: "Dockerfile"
  deployment:
    strategy: "{{DEPLOYMENT_STRATEGY}}"
    replicas: {{REPLICAS}}
  healthCheck:
    path: "/health"
    port: {{PORT}}
