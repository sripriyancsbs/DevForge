services:
  postgres:
    image: postgres:16-alpine
    container_name: devforge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-devforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devforge_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-devforge_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-devforge} -d ${POSTGRES_DB:-devforge_db}"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      devforge-network:
        aliases:
          - postgres
          - devforge-postgres

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: devforge-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-devforge}:${POSTGRES_PASSWORD:-devforge_secure_password}@postgres:5432/${POSTGRES_DB:-devforge_db}}
      BACKEND_HOST: "0.0.0.0"
      BACKEND_PORT: "8000"
      ENVIRONMENT: "development"
      ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173,https://frontend-two-self-3343htd1ck.vercel.app"
      DEVFORGE_TEMPLATES_DIR: "/app/templates"
      DEVFORGE_WORKSPACE_DIR: "/app/.devforge/generated"
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_OWNER: ${GITHUB_OWNER:-sripriyancsbs}
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/tests:/app/tests
      - ./templates:/app/templates
      - ./ansible:/app/ansible
      - ./terraform:/app/terraform
      - ./gitops:/app/gitops
      - ./.devforge/kubeconfig:/root/.kube/config:ro
      - generated_workspace:/app/.devforge/generated
    networks:
      - devforge-network

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: devforge-worker
    restart: unless-stopped
    command: ["python", "-m", "app.worker.provisioning_worker"]
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-devforge}:${POSTGRES_PASSWORD:-devforge_secure_password}@postgres:5432/${POSTGRES_DB:-devforge_db}}
      ENVIRONMENT: "development"
      DEVFORGE_TEMPLATES_DIR: "/app/templates"
      DEVFORGE_WORKSPACE_DIR: "/app/.devforge/generated"
      WORKER_POLL_INTERVAL: "1.0"
      WORKER_METRICS_PORT: "8001"
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_OWNER: ${GITHUB_OWNER:-sripriyancsbs}
    ports:
      - "8001:8001"
    volumes:
      - ./backend/app:/app/app
      - ./templates:/app/templates
      - ./ansible:/app/ansible
      - ./terraform:/app/terraform
      - ./gitops:/app/gitops
      - ./.devforge/kubeconfig:/root/.kube/config:ro
      - generated_workspace:/app/.devforge/generated
    networks:
      - devforge-network

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: devforge-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    ports:
      - "3000:80"
    networks:
      - devforge-network

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: devforge-postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER:-devforge}:${POSTGRES_PASSWORD:-devforge_secure_password}@postgres:5432/${POSTGRES_DB:-devforge_db}?sslmode=disable"
    ports:
      - "9187:9187"
    networks:
      - devforge-network
    depends_on:
      postgres:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: devforge-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    networks:
      - devforge-network
    depends_on:
      - backend
      - worker

  grafana:
    image: grafana/grafana:10.4.1
    container_name: devforge-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    networks:
      - devforge-network
    depends_on:
      - prometheus

volumes:
  postgres_data:
    driver: local
  generated_workspace:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  devforge-network:
    driver: bridge

