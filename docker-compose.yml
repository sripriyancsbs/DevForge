services:
  postgres:
    image: postgres:16-alpine
    container_name: devforge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-devforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devforge_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-devforge_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-devforge} -d ${POSTGRES_DB:-devforge_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - devforge-network

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: devforge-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-devforge}:${POSTGRES_PASSWORD:-devforge_secure_password}@postgres:5432/${POSTGRES_DB:-devforge_db}
      BACKEND_HOST: "0.0.0.0"
      BACKEND_PORT: "8000"
      ENVIRONMENT: "development"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    networks:
      - devforge-network

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: devforge-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"
    networks:
      - devforge-network

volumes:
  postgres_data:
    driver: local

networks:
  devforge-network:
    driver: bridge
