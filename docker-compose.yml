services:
  postgres:
    image: postgres:16-alpine
    container_name: devforge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-devforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devforge_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-devforge_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-devforge} -d ${POSTGRES_DB:-devforge_db}"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      devforge-network:
        aliases:
          - postgres
          - devforge-postgres

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: devforge-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-devforge}:${POSTGRES_PASSWORD:-devforge_secure_password}@postgres:5432/${POSTGRES_DB:-devforge_db}
      BACKEND_HOST: "0.0.0.0"
      BACKEND_PORT: "8000"
      ENVIRONMENT: "development"
      ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173"
      DEVFORGE_TEMPLATES_DIR: "/app/templates"
      DEVFORGE_WORKSPACE_DIR: "/app/.devforge/generated"
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_OWNER: ${GITHUB_OWNER:-sripriyancsbs}
    ports:
      - "8000:8000"
    volumes:
      - generated_workspace:/app/.devforge/generated
    networks:
      - devforge-network

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: devforge-worker
    restart: unless-stopped
    command: ["python", "-m", "app.worker.provisioning_worker"]
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-devforge}:${POSTGRES_PASSWORD:-devforge_secure_password}@postgres:5432/${POSTGRES_DB:-devforge_db}
      ENVIRONMENT: "development"
      DEVFORGE_TEMPLATES_DIR: "/app/templates"
      DEVFORGE_WORKSPACE_DIR: "/app/.devforge/generated"
      WORKER_POLL_INTERVAL: "1.0"
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_OWNER: ${GITHUB_OWNER:-sripriyancsbs}
    volumes:
      - generated_workspace:/app/.devforge/generated
    networks:
      - devforge-network

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: devforge-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    ports:
      - "3000:80"
    networks:
      - devforge-network

volumes:
  postgres_data:
    driver: local
  generated_workspace:
    driver: local

networks:
  devforge-network:
    driver: bridge
