  labels:
    app.kubernetes.io/name: order-svc-8c40f5
    app.kubernetes.io/instance: order-svc-8c40f5
    app.kubernetes.io/part-of: devforge
    app.kubernetes.io/managed-by: argocd
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: order-svc-8c40f5
  template:
