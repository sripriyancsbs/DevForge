apiVersion: apps/v1
kind: Deployment
metadata:
  name: devforge-inventory-api
  labels:
    app.kubernetes.io/name: inventory-api
    app.kubernetes.io/instance: inventory-api
    app.kubernetes.io/part-of: devforge
    app.kubernetes.io/managed-by: argocd
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: inventory-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: inventory-api
        app.kubernetes.io/instance: inventory-api
        app.kubernetes.io/part-of: devforge
        app.kubernetes.io/managed-by: argocd
    spec:
      containers:
      - name: inventory-api
        image: ghcr.io/sripriyancsbs/inventory-api:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8000
          protocol: TCP
        env:
        - name: ENVIRONMENT
          value: development
        - name: PORT
          value: '8000'
        - name: DEVFORGE_APP_NAME
          value: inventory-api
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 15
          timeoutSeconds: 3
          failureThreshold: 3
